# Window rules for specific applications

# CopyQ - floating clipboard manager
windowrule = float, class:^(com.github.hluk.copyq)$
windowrule = size 800 500, class:^(com.github.hluk.copyq)$
windowrule = center, class:^(com.github.hluk.copyq)$
windowrule = opacity 0.95, class:^(com.github.hluk.copyq)$