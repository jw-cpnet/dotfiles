# Extra env variables
# env = MY_GLOBAL_ENV,setting

# Force XWayland apps to use proper scaling
# env = XCURSOR_SIZE,32  # Commented out to use Omarchy default cursor size
env = GDK_SCALE,2
env = GDK_DPI_SCALE,0.5

# Fcitx5 input method configuration for Wayland
# Don't set GTK_IM_MODULE on Wayland - use native text-input protocol
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
env = GLFW_IM_MODULE,ibus
env = QT_IM_MODULES,wayland;fcitx;ibus
