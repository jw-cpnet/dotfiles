# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input
input {
  # Use multiple keyboard layouts and switch between them with Left Alt + Right Alt
  # kb_layout = us,dk,eu
  kb_layout = us
  kb_options = compose:caps # ,grp:alts_toggle

  # Change speed of keyboard repeat
  repeat_rate = 40
  repeat_delay = 600

  # Start with numlock on by default
  numlock_by_default = true

  # Increase sensitity for mouse/trackpack (default: 0)
  # sensitivity = 0.35

  touchpad {
    # Use natural (inverse) scrolling
    natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    clickfinger_behavior = true

    # Enable tap-to-click
    tap-to-click = true

    # Control the speed of your scrolling
    scroll_factor = 0.4
  }
}

# Scroll nicely in the terminal
windowrule = scrolltouchpad 1.5, class:(Alacritty|kitty)
windowrule = scrolltouchpad 0.2, class:com.mitchellh.ghostty

# Enable touchpad gestures for changing workspaces
# See https://wiki.hyprland.org/Configuring/Gestures/

# Define touchpad gestures
# 3-finger gestures (confirmed working)
gesture = 3, horizontal, workspace  # Swipe left/right to change workspace
gesture = 3, up, fullscreen         # Swipe up to fullscreen
gesture = 3, down, float            # Swipe down to float/tile window

# 4-finger gestures (may not work due to hardware limitations)
gesture = 4, up, dispatcher, exec wofi --show drun  # Swipe up for app launcher
gesture = 4, down, close            # Swipe down to close window
gesture = 4, horizontal, move       # Swipe horizontally to move window

# Pinch gestures (may not work due to hardware limitations)
gesture = 3, pinchin, dispatcher, exec hyprctl dispatch splitratio -0.1
gesture = 3, pinchout, dispatcher, exec hyprctl dispatch splitratio 0.1

# Note: 4-finger and pinch gestures may not work due to touchpad hardware limitations
# The Z13 touchpad was originally detected as a mouse and may lack full gesture support
